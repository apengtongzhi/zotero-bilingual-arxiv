<vbox id="mktero-prefpane" class="mktero-prefpane"
      xmlns:html="http://www.w3.org/1999/xhtml">
  <vbox class="mktero-group">
    <label value="LLM 翻译接口（可替换为任意 OpenAI 兼容服务）" class="mktero-h"/>

    <hbox align="center">
      <label value="Base URL" control="mktero-base-url" class="mktero-l"/>
      <html:input id="mktero-base-url" type="text" flex="1"
                  placeholder="https://api.example.com/v1"/>
    </hbox>
    <hbox align="center">
      <label value="模型" control="mktero-model" class="mktero-l"/>
      <html:input id="mktero-model" type="text" flex="1"
                  placeholder="deepseek-v4-flash"/>
    </hbox>
    <hbox align="center">
      <label value="API Key" control="mktero-api-key" class="mktero-l"/>
      <html:input id="mktero-api-key" type="password" flex="1"
                  placeholder="sk-...（留空表示不修改）"/>
      <button id="mktero-toggle-key" label="显示"/>
    </hbox>
    <label value="密钥只保存在本机 ~/.mktero_llm_config.json（权限 600），不写入插件、日志或工作区。留空则沿用已保存的密钥。"
           class="mktero-hint"/>
    <hbox align="center">
      <button id="mktero-save" label="保存 API 配置"/>
      <button id="mktero-test-llm" label="测试连接"/>
      <label id="mktero-llm-status" value=""/>
    </hbox>
  </vbox>

  <vbox class="mktero-group">
    <label value="转换器与运行环境" class="mktero-h"/>
    <hbox align="center">
      <label value="转换器目录" control="mktero-converter-dir" class="mktero-l"/>
      <html:input id="mktero-converter-dir" type="text" flex="1"
                  preference="extensions.mkterobilang.converterDir"/>
    </hbox>
    <hbox align="center">
      <label value="python3 路径" control="mktero-python" class="mktero-l"/>
      <html:input id="mktero-python" type="text" flex="1"
                  preference="extensions.mkterobilang.python"/>
    </hbox>
    <label value="转换器目录需含 arxiv_to_zotero.py、arxiv_translate.py、bilingual_to_zotero.py、formula_svg.py 与 vendor/tex-svg.js。"
           class="mktero-hint"/>
  </vbox>

  <vbox class="mktero-group">
    <label value="使用入口" class="mktero-h"/>
    <label value="右键文献条目 → 生成双语阅读快照（选 md 文件 / 选论文目录），或「从 arXiv 生成双语快照」。arXiv 入口自动从条目 URL / Extra / DOI 提取 ID，找不到会弹框让你填。"
           class="mktero-hint"/>
  </vbox>
</vbox>
